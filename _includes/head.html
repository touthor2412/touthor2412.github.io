<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- comment -%}
  The inline script below sets light or dark mode before the page shows, so there is no white flash.
  The CSP allows it by its sha256 hash. If you change the script, the hash must change too.
{%- endcomment %}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-SqY6OlJJKdUQyEtjRXy9AjQNIx4ylur8JxF3mWnreKQ='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
