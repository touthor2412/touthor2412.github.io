{% assign url = page.url | default: '/' %}
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}">{% include koi-logo.svg %}Touthor</a>
    <div class="header-actions">
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if url == '/' or url == '/index.html' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/stories/' | relative_url }}"{% if url == '/stories/' %} aria-current="page"{% elsif page.layout == 'post' %} aria-current="true"{% endif %}>Stories</a>
        <a href="{{ '/journey/' | relative_url }}"{% if url == '/journey/' %} aria-current="page"{% endif %}>Journey</a>
        <a href="{{ '/research/' | relative_url }}"{% if url == '/research/' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" data-theme-toggle>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      </button>
    </div>
  </div>
</header>
