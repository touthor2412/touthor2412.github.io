---
layout: default
---
<div class="page-main">
  <div class="wrap {{ page.wrap }}">
    {% if page.eyebrow %}<p class="pill-label">{% include sparkle.svg %}{{ page.eyebrow }}</p>{% endif %}
    {% if page.big %}
    <h1 class="display-title"><span class="display-kicker">{{ page.kicker }}</span> <span class="display-word">{{ page.big }}</span></h1>
    {% else %}
    <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
    {% endif %}
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
    <div class="{{ page.body_class | default: 'prose' }}">
      {{ content }}
    </div>
  </div>
</div>
