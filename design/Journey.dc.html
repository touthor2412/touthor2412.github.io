<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touthor: My journey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent-hover)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</helmet>
<div style="{{rootStyle}}">

<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding:14px 40px;border-bottom:1px solid var(--line)">
<a href="Main.dc.html" style="display:inline-flex;align-items:center;gap:12px;min-height:44px;font-family:'Outfit',system-ui,sans-serif;font-size:22px;font-weight:800;letter-spacing:0.06em">
<svg width="50" height="21" viewBox="0 0 220 90" aria-hidden="true"><path d="M10 45 C40 8 120 6 170 38 L214 14 C206 34 206 56 214 76 L170 52 C120 84 40 82 10 45 Z" style="fill:#FFFFFF;stroke:var(--ink);stroke-width:5"/><path d="M52 22 C76 12 100 16 112 30 C100 40 70 42 50 36 Z" style="fill:var(--koi)"/><path d="M104 52 C126 44 150 48 160 56 C146 66 118 68 104 60 Z" style="fill:var(--koi)"/><circle cx="34" cy="40" r="4" style="fill:var(--ink)"/></svg>
TOUTHOR</a>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
<nav aria-label="Main" style="display:flex;flex-wrap:wrap;gap:2px">
<a href="Main.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:500">Home</a>
<a href="Stories.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:500">Stories</a>
<a href="Journey.dc.html" aria-current="page" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:700;background:var(--soft);color:var(--accent)">Journey</a>
<a href="Research.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:500">Research</a>
<a href="Main.dc.html#contact" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:500">Contact</a>
</nav>
<button type="button" onClick="{{toggleTheme}}" aria-label="Dark mode" aria-pressed="{{darkPressed}}" style="width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
<sc-if value="{{showMoon}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
<sc-if value="{{showSun}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
</button>
</div>
</header>

<main style="padding:64px 40px 96px">
<div style="max-width:900px;margin:0 auto">
<p style="margin:0 0 4px;font-family:'Outfit',system-ui,sans-serif;font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-0.02em">Step by step</p>
<h1 style="margin:0 0 20px;font-family:'Outfit',system-ui,sans-serif;font-size:clamp(56px,8.5vw,104px);line-height:0.95;font-weight:800;letter-spacing:-0.03em;text-transform:uppercase;color:var(--accent)">My journey</h1>
<p style="margin:0 0 56px;max-width:32em;font-size:20px;line-height:1.6;color:var(--muted)">The big moments so far. Each one can link to a full story.</p>

<ol style="list-style:none;margin:0;padding:0 0 0 4px;border-left:3px solid var(--line-strong);display:flex;flex-direction:column;gap:24px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="6">
<li style="position:relative;padding-left:36px">
<span aria-hidden="true" style="{{st.dot}}"></span>
<div style="background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 28px;box-shadow:var(--shadow)">
<p style="margin:0 0 6px;font-size:15px;font-weight:700;color:var(--accent)">{{st.when}}</p>
<h2 style="margin:0 0 10px;font-family:'Outfit',system-ui,sans-serif;font-size:27px;line-height:1.2;font-weight:700">{{st.title}}</h2>
<p style="margin:0;max-width:36em;font-size:18px;line-height:1.6;color:var(--muted)">{{st.text}}</p>
<sc-if value="{{st.hasStory}}" hint-placeholder-val="{{ true }}">
<a href="Story.dc.html" style="display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-size:16px;font-weight:700;color:var(--accent)">Read the story →</a>
</sc-if>
</div>
</li>
</sc-for>
</ol>
</div>
</main>

<footer style="background:var(--footer);color:var(--footer-text);padding:40px;border-radius:36px 36px 0 0">
<p style="max-width:1160px;margin:0 auto;font-size:15px;color:var(--footer-muted)">© 2026 Touthor Hangsengsua · Hosted on GitHub Pages</p>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":2250}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: null };
}
theme() {
const THEMES = {
light: { bg: '#F6F3FC', surface: '#FFFFFF', ink: '#1D1533', muted: '#5B5374', line: '#E3DCF4', 'line-strong': '#CFC4EE', soft: '#ECE6FB', ph: '#DCD1F6', ph2: '#E6DDF8', ph3: '#D4CBF2', accent: '#6A4BD6', 'on-accent': '#FFFFFF', 'accent-hover': '#5236B8', panel: '#6A4BD6', 'panel-text': '#FFFFFF', 'panel-muted': '#E7E0FF', koi: '#C8432C', footer: '#1D1533', 'footer-text': '#F4F0FF', 'footer-muted': '#B9B0D6', ring: '#C9BCF2', shadow: '0 14px 36px rgba(60,40,140,0.10)' },
dark: { bg: '#130E24', surface: '#1E1738', ink: '#F4F0FF', muted: '#B8ADDC', line: '#352B5E', 'line-strong': '#4A3D80', soft: '#1B1432', ph: '#2C2354', ph2: '#33285F', ph3: '#271F4C', accent: '#B19CFF', 'on-accent': '#130E24', 'accent-hover': '#CDBEFF', panel: '#3B2A82', 'panel-text': '#FFFFFF', 'panel-muted': '#D9CFFF', koi: '#FF8068', footer: '#0C0918', 'footer-text': '#F4F0FF', 'footer-muted': '#B8ADDC', ring: '#4A3D80', shadow: '0 14px 36px rgba(0,0,0,0.35)' }
};
const mode = this.state.mode || this.props.theme || 'light';
const t = THEMES[mode] || THEMES.light;
const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';');
return {
rootStyle: vars + ";background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;transition:background-color 0.3s ease,color 0.3s ease",
darkPressed: mode === 'dark' ? 'true' : 'false',
showSun: mode === 'dark',
showMoon: mode !== 'dark',
toggleTheme: () => this.setState({ mode: mode === 'dark' ? 'light' : 'dark' })
};
}
renderVals() {
const dot = (filled) => 'position:absolute;left:-16px;top:28px;width:20px;height:20px;border-radius:50%;box-sizing:border-box;border:3px solid var(--accent);background:' + (filled ? 'var(--accent)' : 'var(--bg)');
const steps = [
{ when: '[Year]', title: 'Growing up in Laos', text: '[Where you grew up, your family, what you loved as a child.]', hasStory: false, filled: true },
{ when: '[Year]', title: '[University or first big step]', text: '[What you studied before Japan and what made you want to go further.]', hasStory: false, filled: true },
{ when: '[Year]', title: 'Moving to Niigata, Japan', text: 'Starting a master’s degree at Niigata University, in a new country and a new language.', hasStory: true, filled: true },
{ when: '2026', title: 'Internships in Japan', text: 'Working with Japanese companies on real projects, and learning how teams work here.', hasStory: true, filled: true },
{ when: 'November 2026', title: 'Teaching English', text: 'Starting as a part-time English tutor at the university.', hasStory: false, filled: true },
{ when: 'Next', title: 'What comes after', text: '[Finishing the master’s, and what you hope for next.]', hasStory: false, filled: false }
].map((s) => Object.assign({}, s, { dot: dot(s.filled) }));
return Object.assign(this.theme(), { steps });
}
}
</script>
</body>
</html>
